name: Update DYLIO-LIVE playlists and TV guide

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'
  push:
    branches: [main]
    paths:
      - build.py
      - epg.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Wi-Fi and cellular playlists
        run: python3 build.py
      - name: Generate XMLTV guide and web guide
        run: python3 epg.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wifi.m3u cellular.m3u missing-channels.txt stream-report.txt epg-report.txt
          if test -f guide.xml; then git add guide.xml; fi
          if test -f guide.html; then git add guide.html; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh DYLIO-LIVE playlists and guide'
            git push
          fi
